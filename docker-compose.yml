services:
  postgres:
    image: postgres:16-alpine
    container_name: flowforge-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flowforge}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env - copy .env.example to get started}
    ports:
      - "5432:5432"
    volumes:
      - flowforge-postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - flowforge-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: flowforge-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - flowforge-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: flowforge-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: unless-stopped
    networks:
      - flowforge-network

  minio:
    image: minio/minio:latest
    container_name: flowforge-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env - copy .env.example to get started}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - flowforge-minio-data:/data
    restart: unless-stopped
    networks:
      - flowforge-network

  mailhog:
    image: mailhog/mailhog:latest
    container_name: flowforge-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped
    networks:
      - flowforge-network

  seq:
    image: datalust/seq:latest
    container_name: flowforge-seq
    environment:
      ACCEPT_EULA: Y
    ports:
      - "5341:80"
    volumes:
      - flowforge-seq-data:/data
    restart: unless-stopped
    networks:
      - flowforge-network

  api:
    build:
      context: .
      dockerfile: backend/src/FlowForge.API/Dockerfile
    container_name: flowforge-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-flowforge};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      Redis__ConnectionString: "redis:6379"
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Username: ${RABBITMQ_USER:-guest}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD:-guest}
      MinIO__Endpoint: "minio:9000"
      MinIO__AccessKey: ${MINIO_ROOT_USER:-minioadmin}
      MinIO__SecretKey: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      Email__SmtpHost: mailhog
      Email__SmtpPort: "1025"
      Jwt__Key: ${JWT_KEY:?Set JWT_KEY in .env - copy .env.example to get started, at least 32 chars}
      Jwt__Issuer: ${JWT_ISSUER:-FlowForge}
      Jwt__Audience: ${JWT_AUDIENCE:-FlowForgeUsers}
    ports:
      - "5076:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
      minio:
        condition: service_started
      mailhog:
        condition: service_started
    restart: unless-stopped
    networks:
      - flowforge-network

  workers:
    build:
      context: .
      dockerfile: backend/src/FlowForge.Workers/Dockerfile
    container_name: flowforge-workers
    environment:
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-flowforge};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      Redis__ConnectionString: "redis:6379"
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Username: ${RABBITMQ_USER:-guest}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD:-guest}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    restart: unless-stopped
    networks:
      - flowforge-network

volumes:
  flowforge-postgres-data:
  flowforge-minio-data:
  flowforge-seq-data:

networks:
  flowforge-network:
    driver: bridge
