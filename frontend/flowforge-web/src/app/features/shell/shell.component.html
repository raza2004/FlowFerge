<div class="flex h-screen bg-gray-50">
  <!-- Sidebar -->
  <aside class="w-16 bg-gray-900 flex flex-col items-center py-4 gap-2">
    <!-- Logo -->
    <div class="w-10 h-10 bg-indigo-500 rounded-xl flex items-center justify-center mb-4">
      <mat-icon class="text-white">bolt</mat-icon>
    </div>

    <!-- Nav links -->
    <a routerLink="/projects" routerLinkActive="bg-gray-700"
       matTooltip="Projects" matTooltipPosition="right"
       class="w-10 h-10 rounded-lg flex items-center justify-center text-gray-400 hover:text-white hover:bg-gray-700 transition-colors">
      <mat-icon>folder</mat-icon>
    </a>

    <div class="flex-1"></div>

    <!-- User avatar / logout -->
    <button mat-icon-button (click)="auth.logout()"
            matTooltip="Sign out" matTooltipPosition="right"
            class="text-gray-400 hover:text-white">
      <mat-icon>logout</mat-icon>
    </button>
  </aside>

  <!-- Main content -->
  <main class="flex-1 overflow-auto p-6">
    <router-outlet />
  </main>
</div>
