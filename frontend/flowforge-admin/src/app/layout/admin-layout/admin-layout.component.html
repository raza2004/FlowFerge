<div class="flex h-screen bg-[#FAFAF9]">
  <!-- Sidebar -->
  <aside class="w-60 bg-[#18181B] text-zinc-300 flex flex-col">
    <div class="px-4 py-4 border-b border-zinc-800 flex items-center gap-2.5">
      <div class="w-8 h-8 rounded-md bg-admin-700 flex items-center justify-center text-white">
        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="3" y="13" width="4.5" height="8" rx="1.5" fill="white" fill-opacity="0.55"/>
          <rect x="9.75" y="8" width="4.5" height="13" rx="1.5" fill="white" fill-opacity="0.8"/>
          <rect x="16.5" y="3" width="4.5" height="18" rx="1.5" fill="white"/>
        </svg>
      </div>
      <div class="flex-1 min-w-0">
        <div class="text-sm font-semibold text-white truncate">FlowForge</div>
        <div class="text-[11px] text-zinc-500 truncate">System Admin</div>
      </div>
    </div>

    <nav class="px-2 mt-3">
      @for (item of nav; track item.path) {
        <a [routerLink]="item.path" routerLinkActive="!bg-zinc-800 !text-white"
           class="flex items-center gap-3 px-3 py-1.5 rounded-md text-sm text-zinc-400 hover:bg-zinc-800/50 hover:text-white transition-colors">
          <mat-icon class="!text-lg !w-5 !h-5">{{ item.icon }}</mat-icon>
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>

    <div class="flex-1"></div>

    <div class="p-3 border-t border-zinc-800">
      <div class="flex items-center gap-2.5 px-2 py-1.5">
        <div class="w-7 h-7 rounded-full bg-gradient-to-br from-admin-400 to-admin-700 flex items-center justify-center text-white font-bold text-xs">
          {{ (auth.user()?.fullName ?? '?').charAt(0) }}
        </div>
        <div class="flex-1 min-w-0">
          <div class="text-sm text-white truncate">{{ auth.user()?.fullName }}</div>
          <div class="text-[11px] text-zinc-500 truncate">{{ auth.user()?.email }}</div>
        </div>
        <button mat-icon-button (click)="logout()" matTooltip="Sign out">
          <mat-icon class="!text-lg !text-zinc-400">logout</mat-icon>
        </button>
      </div>
    </div>
  </aside>

  <!-- Main content -->
  <main class="flex-1 overflow-auto">
    <router-outlet></router-outlet>
  </main>
</div>
