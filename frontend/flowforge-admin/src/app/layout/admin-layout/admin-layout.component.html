<div class="flex h-screen bg-canvas text-ink">
  <!-- Sidebar: the console is the one dark surface in the product, so it never gets mistaken for the app -->
  <aside class="w-60 bg-ink text-canvas/70 flex flex-col">
    <div class="px-5 pt-5 pb-4 border-b border-canvas/10">
      <div class="flex items-baseline gap-1">
        <span class="font-display text-[28px] leading-none text-canvas">FlowForge</span>
        <span class="w-1.5 h-1.5 rounded-full bg-ember-500"></span>
      </div>
      <div class="mt-3 inline-flex items-center gap-1.5 font-mono text-[10px] uppercase tracking-[0.18em] text-ember-400 border border-ember-500/40 rounded-sm px-2 py-0.5">
        Admin console
      </div>
    </div>

    <nav class="mt-4 relative">
      <div class="absolute left-0 right-3 rounded-r-md bg-canvas/[0.07] border-l-2 border-ember-500 transition-all duration-300 ease-out pointer-events-none"
           [style.top.px]="indicator().top"
           [style.height.px]="indicator().height"
           [style.opacity]="indicator().visible ? 1 : 0"></div>
      @for (item of nav; track item.path; let i = $index) {
        <a [routerLink]="item.path" routerLinkActive="!text-canvas"
           (isActiveChange)="onActive($event, i)"
           #navItem
           class="relative z-10 flex items-center gap-3 pl-5 pr-4 py-2 text-sm text-canvas/55 hover:text-canvas transition-colors">
          <mat-icon class="!text-[18px] !w-[18px] !h-[18px]">{{ item.icon }}</mat-icon>
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>

    <div class="flex-1"></div>

    <div class="p-3 border-t border-canvas/10">
      <div class="flex items-center gap-2.5 px-2 py-1.5">
        <div class="w-8 h-8 rounded-full bg-ember-500 flex items-center justify-center text-white font-medium text-xs">
          {{ (auth.user()?.fullName ?? '?').charAt(0) }}
        </div>
        <div class="flex-1 min-w-0">
          <div class="text-sm text-canvas truncate">{{ auth.user()?.fullName }}</div>
          <div class="font-mono text-[10px] text-canvas/45 truncate">{{ auth.user()?.email }}</div>
        </div>
        <button mat-icon-button (click)="logout()" matTooltip="Sign out">
          <mat-icon class="!text-lg !text-canvas/60">logout</mat-icon>
        </button>
      </div>
    </div>
  </aside>

  <!-- Main content -->
  <main class="flex-1 overflow-auto" #routeContainer>
    <router-outlet></router-outlet>
  </main>
</div>
